[project]
name = "smart-bill-organizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "riteshsal", email = "riteshsalve86@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "groq>=1.7.0",
    "psycopg2-binary>=2.9.13",
    "pyngrok>=9.1.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
smart-bill-organizer = "smart_bill_organizer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
